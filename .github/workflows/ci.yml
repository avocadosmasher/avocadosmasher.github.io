name: CI

# PR 과 개발 브랜치 push 에서 배포와 같은 검사를 실행한다.
# main push 는 deploy.yml 이 같은 검사를 실행하므로 여기서 제외한다.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
