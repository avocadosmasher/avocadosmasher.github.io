name: Deploy to GitHub Pages

on:
  # main 브랜치에 push 될 때마다 자동 배포
  push:
    branches: [main]
  # Actions 탭에서 수동 실행도 가능
  workflow_dispatch:

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포가 겹치지 않게 큐 관리
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 검사가 실패하면 여기서 멈추고 아래 deploy job 은 실행되지 않는다.
  # 배포에는 이 검사가 통과한 build 산출물(dist/)을 그대로 사용한다.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      upload_pages: true

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
